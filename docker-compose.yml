# Local, disposable stack for the Solo Coach Onboarding epic.
#
# db / mailpit / minio are the services from the provided Starter Pack.
# Changes to them (schema is NOT touched):
#   - db:    healthcheck added so the app waits for Postgres to be ready
#   - minio: the declared `minio_data` volume is now actually mounted, so
#            uploaded photos/resumes survive container restarts
# Added services:
#   - app: FastAPI backend + built React frontend + local fake auth shim,
#          all on http://localhost:4000

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: coaching_platform_dev
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev_local_only
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d coaching_platform_dev"]
      interval: 3s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"   # SMTP — app sends "emails" here
      - "8025:8025"   # Web inbox — open in browser to click links

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: devkey
      MINIO_ROOT_PASSWORD: devsecret123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data

  app:
    build: .
    env_file: .env
    environment:
      # Container-internal hostnames override the localhost values in .env
      DATABASE_URL: postgres://dev:dev_local_only@db:5432/coaching_platform_dev
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      AUTH_SHIM_URL: http://localhost:4000/auth-shim/authorize
      AUTH_SHIM_PHOTO_BASE_URL: http://localhost:4000
      APP_BASE_URL: http://localhost:4000
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
